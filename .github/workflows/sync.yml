name: Upstream Sync

permissions:
  contents: write
  actions: write
on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          set -e
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"
      
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main
      
          # 1. 先保存本地 nginx()
          python3 keep_nginx.py extract
      
          # 2. 整体同步上游（保留本地其它改动）
          if git diff --quiet HEAD upstream/main; then
            # 和上游完全一致，直接对齐
            git reset --hard upstream/main
            git push --force-with-lease origin main
          else
            # 有本地改动，合并上游
            if ! git pull --no-rebase upstream main; then
              echo "[Error] 合并上游变更产生冲突，自动同步已暂停，请手动 Sync Fork 并解决冲突。"
              echo "[Error] Merge conflict detected while syncing upstream. Please sync your fork manually and resolve the conflicts."
              exit 1
            fi
          fi
      
          # 3. 合并后，把本地 nginx() 替换回去
          python3 keep_nginx.py replace
      
          # 4. 提交推送
          if git diff --quiet; then
            echo "[INFO] 无变化，跳过提交"
          else
            git add _worker.js
            git commit -m "chore: sync upstream, keep local nginx()"
            git push origin main
          fi
          
      - name: Delete old runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo ${{ github.repository }} \
            --workflow "${{ github.workflow }}" \
            --limit 200 \
            --json databaseId,createdAt \
            | jq -r '.[] | select((now - (.createdAt | fromdateiso8601)) > 2*86400) | .databaseId' \
            | while read id; do
                echo "[INFO] 删除 run: $id"
                gh run delete "$id" --repo ${{ github.repository }} || true
              done

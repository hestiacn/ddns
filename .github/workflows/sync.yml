name: Upstream Sync

permissions:
  contents: write
  actions: write
on:
  schedule:
    - cron: "0 0 * * *" # 每天执行
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          set -e
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"
          
          # 0. 在同步前，获取本地当前的版本号
          LOCAL_VER=$(grep -oP "const Version = '\K[^']+" _worker.js || echo "unknown")
          echo "[INFO] 本地当前版本: $LOCAL_VER"
      
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main
          
          # 1. 保存本地 nginx()
          python3 keep_nginx.py extract
      
          # 2. 整体同步上游（保留本地其它改动）
          if git diff --quiet HEAD upstream/main; then
            # 和上游完全一致，直接对齐
            git reset --hard upstream/main
            git push --force-with-lease origin main
          else
            # 有本地改动，合并上游
            if ! git pull --no-rebase upstream main; then
              echo "[Error] 合并上游变更产生冲突，自动同步已暂停，请手动 Sync Fork 并解决冲突。"
              echo "[Error] Merge conflict detected while syncing upstream. Please sync your fork manually and resolve the conflicts."
              exit 1
            fi
          fi
      
          # 3. 合并后，把本地 nginx() 替换回去
          python3 keep_nginx.py replace
          
          # 4. 比对同步后的版本号
          NEW_VER=$(grep -oP "const Version = '\K[^']+" _worker.js || echo "unknown")
          echo "[INFO] 同步后上游版本: $NEW_VER"
          
          if [ "$LOCAL_VER" != "$NEW_VER" ]; then
            echo "🚀 [NOTICE] 发现上游版本更新: $LOCAL_VER -> $NEW_VER"
            # 如果你想把新版本号打印在 GitHub Step Summary 里：
            echo "### 🚀 上游版本更新: $LOCAL_VER -> $NEW_VER" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ [INFO] 版本号无变化 ($NEW_VER)"
          fi

          # 5. 提交推送
          if git diff --quiet; then
            echo "[INFO] 工作区无文件变化。"
            if [ "$LOCAL_VER" != "$NEW_VER" ]; then
               echo "🚀 发现版本更新 ($LOCAL_VER -> $NEW_VER)，正在推送合并记录..."
               git push origin main || true
            else
               echo "✅ [INFO] 版本号无变化 ($NEW_VER)，跳过提交"
            fi
          else
            git add _worker.js
            git commit -m "chore: sync upstream (v$NEW_VER), keep local nginx()"
            git push origin main
          fi
          
      - name: Delete old runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo ${{ github.repository }} \
            --workflow "${{ github.workflow }}" \
            --limit 200 \
            --json databaseId,createdAt \
            | jq -r '.[] | select((now - (.createdAt | fromdateiso8601)) > 2*86400) | .databaseId' \
            | while read id; do
                echo "[INFO] 删除 run: $id"
                gh run delete "$id" --repo ${{ github.repository }} || true
              done
